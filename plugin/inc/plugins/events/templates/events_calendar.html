<html>
<head>
    <title>Events Calendar - {$mybb->settings['bbname']}</title>
    {$headerinclude}
    <style>
        .events_calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #ccc;
        }
        .calendar_day {
            background: white;
            padding: 10px;
            min-height: 100px;
        }
        .calendar_day.other_month {
            background: #f5f5f5;
        }
        .calendar_event {
            background: #4CAF50;
            color: white;
            padding: 2px 5px;
            margin: 2px 0;
            font-size: 12px;
            cursor: pointer;
        }
        .calendar_event.rsvped {
            background: #2196F3;
        }
    </style>
</head>
<body>
    {$header}
    
    <div class="events_container">
        <h1>Events Calendar</h1>
        
        <div class="events_controls">
            <a href="events.php?view=list" class="button">List View</a>
            <a href="events.php?view=calendar" class="button">Calendar View</a>
            
            <form method="get" action="events.php" style="display: inline-block; margin-left: 20px;">
                <input type="hidden" name="view" value="calendar">
                <select name="region">
                    <option value="">All Regions</option>
                    <option value="Sydney" {$region_sydney_selected}>Sydney</option>
                    <option value="Hunter" {$region_hunter_selected}>Hunter</option>
                    <option value="Canberra" {$region_canberra_selected}>Canberra</option>
                    <option value="Other" {$region_other_selected}>Other</option>
                </select>
                <input type="submit" value="Filter" class="button">
            </form>
        </div>
        
        <div class="events_calendar">
            {$calendar_content}
        </div>
    </div>
    
    {$footer}
</body>
</html>

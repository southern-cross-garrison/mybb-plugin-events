<html>
<head>
<title>Events Calendar - {$mybb->settings['bbname']}</title>
{$headerinclude}
</head>
<body>
{$header}
<div id="events_page" class="events_page_wrap">
{$events_print_header}
<table border="0" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" class="tborder">
<tr class="no-print"><td class="trow1">
<div class="events_toolbar">
<span class="events_month_nav">
<a class="events_month_step" href="events.php?view=calendar&amp;month={$calendar_prev}{$calendar_filter_params}" id="events_calendar_prev" title="Previous month" aria-label="Previous month">&laquo;</a>
<span class="events_month_name">{$calendar_month_name}</span>
<a class="events_month_step" href="events.php?view=calendar&amp;month={$calendar_next}{$calendar_filter_params}" id="events_calendar_next" title="Next month" aria-label="Next month">&raquo;</a>
</span>
{$events_filter_disclosure}
<form method="get" action="events.php" class="events_filter_form" id="events_filter_form">
<input type="hidden" name="view" value="calendar" />
<input type="hidden" name="month" value="{$calendar_month}" />
<select name="region" id="events_region_filter" class="events_select">{$region_options}</select>
{$events_archived_filter}
<noscript><input type="submit" class="button" value="Filter" /></noscript>
</form>
{$events_manage_link}
{$events_view_toggle}
</div>
</td></tr>
<tr><td class="trow1">
<table id="events_calendar">
<tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
{$calendar_content}
</table>
</td></tr>
</table>
</div>
{$events_filter_script}
{$footer}
</body>
</html>

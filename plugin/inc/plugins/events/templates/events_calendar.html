<html>
<head>
<title>Events Calendar - {$mybb->settings['bbname']}</title>
{$headerinclude}
</head>
<body>
{$header}
<div id="events_page" class="events_page_wrap">
<table border="0" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" class="tborder">
<tr><td class="thead"><strong>Events Calendar - {$calendar_month_name}</strong></td></tr>
<tr><td class="trow1">
<div class="events_toolbar">
<span class="events_toolbar_group">
<a href="events.php?view=list" id="events_view_list">List View</a> |
<a href="events.php?view=calendar" id="events_view_calendar">Calendar View</a>
</span>
<span class="events_toolbar_group">
<a href="events.php?view=calendar&amp;month={$calendar_prev}" id="events_calendar_prev">&laquo; Previous</a> |
<a href="events.php?view=calendar&amp;month={$calendar_next}" id="events_calendar_next">Next &raquo;</a>
</span>
<form method="get" action="events.php" class="events_filter_form">
<input type="hidden" name="view" value="calendar" />
<input type="hidden" name="month" value="{$calendar_month}" />
<select name="region" id="events_region_filter" class="events_select">{$region_options}</select>
<input type="submit" class="button" value="Filter" />
</form>
</div>
</td></tr>
<tr><td class="trow1">
<table id="events_calendar">
<tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
{$calendar_content}
</table>
</td></tr>
</table>
</div>
{$footer}
</body>
</html>

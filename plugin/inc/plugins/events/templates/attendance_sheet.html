<html>
<head>
    <title>Attendance Sheet - {$mybb->settings['bbname']}</title>
    {$headerinclude}
    <style>
        @media print {
            body { margin: 0; padding: 20px; }
            .no-print { display: none; }
            .attendance_table { width: 100%; border-collapse: collapse; }
            .attendance_table th, .attendance_table td {
                border: 1px solid #000;
                padding: 8px;
                text-align: left;
            }
            .attendance_table th {
                background: #f0f0f0;
                font-weight: bold;
            }
        }
        .attendance_table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .attendance_table th, .attendance_table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .attendance_table th {
            background: #f0f0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    {$header}
    
    <div class="attendance_sheet">
        <div class="no-print">
            <h1>Attendance Sheet</h1>
            <p><strong>Event:</strong> {$event_title}</p>
            {if $day_date}
            <p><strong>Day:</strong> {$day_date}</p>
            {/if}
            <p><a href="javascript:window.print()" class="button">Print</a></p>
        </div>
        
        <h2 class="print-only">{$event_title}</h2>
        {if $day_date}
        <h3 class="print-only">{$day_date}</h3>
        {/if}
        
        <table class="attendance_table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Real Name</th>
                    <th>Username</th>
                    <th>TK ID</th>
                    <th>Costumes</th>
                    {if $show_contact_info}
                    <th>Mobile</th>
                    <th>Emergency Contact</th>
                    {/if}
                </tr>
            </thead>
            <tbody>
                {$attendees_list}
            </tbody>
        </table>
    </div>
    
    {$footer}
</body>
</html>

<html>
<head>
<title>Attendance Sheet - {$mybb->settings['bbname']}</title>
{$headerinclude}
<style type="text/css">
#attendance_table { width: 100%; border-collapse: collapse; margin: 20px 0; }
#attendance_table th, #attendance_table td { border: 1px solid #999; padding: 8px; text-align: left; }
#attendance_table th { background: #f0f0f0; font-weight: bold; }
@media print { .no-print { display: none; } body { margin: 0; padding: 20px; } }
</style>
</head>
<body>
{$header}
<div id="attendance_sheet" data-event-id="{$event_id}">
<div class="no-print">
<h2>Attendance Sheet</h2>
<p><a href="javascript:window.print();" id="attendance_print">Print</a> |
<a href="event.php?id={$event_id}" id="attendance_back">Back to Event</a></p>
{$attendance_day_filter}
</div>
<h3 id="attendance_event_title">{$event_title}</h3>
{$attendance_day_heading}
<table id="attendance_table">
<thead>
<tr>
<th>#</th>
<th>Username</th>
<th>Role</th>
<th>TK ID</th>
<th>Costumes</th>
<th>Mobile</th>
<th>Emergency Contact</th>
<th>Signature</th>
</tr>
</thead>
<tbody>
{$attendees_rows}
</tbody>
</table>
</div>
{$footer}
</body>
</html>

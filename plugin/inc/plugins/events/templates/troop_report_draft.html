<html>
<head>
    <title>Create Troop Report - {$mybb->settings['bbname']}</title>
    {$headerinclude}
</head>
<body>
    {$header}
    
    <div class="troop_report">
        <h1>Create Troop Report</h1>
        
        <p>Edit the draft below and click "Post Troop Report" to create the forum post.</p>
        
        <form method="post" action="troop_report.php?id={$event_id}&action=post">
            <input type="hidden" name="my_post_key" value="{$mybb->post_code}">
            
            <div class="form_section">
                <label><strong>Report Content:</strong></label>
                <textarea name="report_content" rows="20" cols="80" style="width: 100%;">{$draft_content}</textarea>
                <small>You can edit this content before posting.</small>
            </div>
            
            <div class="form_actions">
                <input type="submit" value="Post Troop Report" class="button">
                <a href="event.php?id={$event_id}" class="button">Cancel</a>
            </div>
        </form>
    </div>
    
    {$footer}
</body>
</html>

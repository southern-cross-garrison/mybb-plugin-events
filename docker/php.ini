; Test-environment PHP settings. Errors are surfaced loudly so the e2e suite fails
; on notices/warnings that would otherwise be invisible in rendered pages.
date.timezone = UTC
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log
max_execution_time = 60
memory_limit = 256M
opcache.enable = 0
opcache.enable_cli = 0

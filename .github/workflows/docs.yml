name: docs

# Builds the user guide in docs/ and publishes it to GitHub Pages. Screenshots are not
# taken here: they need the dev forum, so they are taken locally with
# `pnpm run screenshots` and committed alongside the pages that use them.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Starlight's "Last updated" date comes from each page's last commit.
          fetch-depth: 0

      # pnpm/setup is the successor to pnpm/action-setup for pnpm 11 and newer. It reads
      # the pnpm version from `packageManager` in docs/package.json, installs Node, and
      # runs `pnpm install --frozen-lockfile` in docs/ - not at the repo root, which is
      # the npm-managed test suite.
      - uses: pnpm/setup@v3
        with:
          working-directory: docs
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Build
        working-directory: docs
        run: pnpm run build

      # Pull requests only check that the guide builds.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

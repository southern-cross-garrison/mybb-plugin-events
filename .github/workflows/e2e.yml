name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Cache the pinned MyBB release
        uses: actions/cache@v4
        with:
          path: .devenv/cache
          key: mybb-${{ hashFiles('scripts/env.sh') }}

      - name: Bootstrap the test forum
        run: ./scripts/bootstrap.sh --fresh

      - name: Run the suite
        run: npx playwright test

      - name: Collect container logs
        if: failure()
        run: |
          docker compose logs --no-color web > .devenv/apache.log || true
          docker compose exec -T web cat /var/www/html/cache/mybb_errors.log > .devenv/mybb_errors.log || true
          docker compose exec -T web cat /var/log/php_errors.log > .devenv/php_errors.log || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .devenv/playwright-report
            .devenv/test-results
            .devenv/*.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

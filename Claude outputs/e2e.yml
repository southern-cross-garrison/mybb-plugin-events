name: e2e

on:
  push:
    branches: [main]
    # A version tag (v1.2) runs the suite too, and publishes a release once it passes.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright end-to-end (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The garrison's host runs 7.4 and the plugin has to keep working when it upgrades, so
    # both ends of the supported range run. Neither cancels the other: a failure on one
    # version is only useful to read alongside the other's result.
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']

    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # scripts/fetch-theme.sh and scripts/install-smartlink.sh clone two private sibling
      # repos. The GITHUB_TOKEN actions/checkout installs is scoped to this repo alone, so
      # without a credential of our own those clones fall back to interactive auth and fail
      # with "could not read Username". THEME_TOKEN is a fine-grained PAT with read-only
      # Contents on mybb-custom-theme and mybb-plugin-smartlink; the rewrite below applies
      # to every github.com https remote, so the scripts keep their plain URLs and work
      # unchanged on a developer machine.
      - name: Authenticate to the private sibling repos
        env:
          THEME_TOKEN: ${{ secrets.THEME_TOKEN }}
        run: |
          if [ -z "$THEME_TOKEN" ]; then
            echo "::error::THEME_TOKEN is not set. The suite needs a fine-grained PAT with" \
                 "read-only Contents access to southern-cross-garrison/mybb-custom-theme and" \
                 "southern-cross-garrison/mybb-plugin-smartlink. See the README's" \
                 "Continuous integration section."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${THEME_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Cache the pinned MyBB release
        uses: actions/cache@v6
        with:
          path: .devenv/cache
          key: mybb-${{ hashFiles('scripts/env.sh') }}

      - name: Bootstrap the test forum
        run: ./scripts/bootstrap.sh --fresh

      # Every file, including ones no test loads: on 7.4 this is what catches syntax that
      # only PHP 8 accepts.
      - name: Lint the plugin
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/src" -w /src "mybb-events-web:php${PHP_VERSION}" \
            -c 'find plugin scripts -name "*.php" -print0 | xargs -0 -n1 php -d display_errors=stderr -l >/dev/null'

      - name: Run the suite
        run: npx playwright test

      - name: Collect container logs
        if: failure()
        run: |
          docker compose logs --no-color web > .devenv/apache.log || true
          docker compose exec -T web cat /var/www/html/cache/mybb_errors.log > .devenv/mybb_errors.log || true
          docker compose exec -T web cat /var/log/php_errors.log > .devenv/php_errors.log || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-php${{ matrix.php }}
          # Everything below lives under .devenv/, and the action ignores files inside
          # dot-directories unless this is set - so without it a failing run uploads an
          # empty artifact and takes its own traces and container logs with it.
          include-hidden-files: true
          path: |
            .devenv/playwright-report
            .devenv/test-results
            .devenv/*.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The zip an administrator uploads to a board. Its root is the forum root - the contents
  # of plugin/, with no folder around them - so it expands straight over a MyBB install.
  # That is also why the documentation stays out of it: anything in the zip lands in the
  # web root. It waits for both PHP versions so a downloaded zip is always one the suite
  # passed on.
  package:
    name: Package the plugin
    needs: e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The artifact is the zip: Actions zips an artifact's files for download, so zipping
      # them here would hand over a zip inside a zip. A directory path uploads what is in
      # it, not the directory itself.
      - name: Upload the plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: mybb-plugin-events-${{ github.sha }}
          path: plugin/
          if-no-files-found: error

  # A version tag publishes a GitHub Release with the zip attached, under the same name
  # every time so the guide can link to the latest one:
  # releases/latest/download/mybb-plugin-events.zip. It waits for the package job, and so
  # for both PHP versions, so a release is always one the suite passed on.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The tag is the release's name and the version in the plugin's metadata is what
      # the Admin CP shows, so a mismatch would publish a release that misreports itself.
      - name: Check the tag matches the plugin version
        run: |
          version=$(grep -oP '"version"\s*=>\s*"\K[^"]+' plugin/inc/plugins/events.php)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in plugin/inc/plugins/events.php"
            exit 1
          fi

      # Same contents as the package job's artifact: plugin/ with no folder around it.
      - name: Build the zip
        working-directory: plugin
        run: zip -r -X ../mybb-plugin-events.zip . -x '*.DS_Store'

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" mybb-plugin-events.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
